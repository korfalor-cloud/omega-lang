[package]
name = "omega-lang"
version = "0.1.0"
edition = "2021"
description = "Omega Programming Language - A modern, safe, and fast programming language"
license = "MIT"

[[bin]]
name = "omega"
path = "src/main.rs"

[lib]
name = "omega_lang"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.0"
rustyline = "12.0"
log = "0.4"
env_logger = "0.10"
num-traits = "0.2"
rand = "0.8"
regex = "1.10"
unicode-segmentation = "1.10"
uuid = { version = "1.6", features = ["v4"] }
chrono = "0.4"
tokio = { version = "1.34", features = ["full"] }
hyper = { version = "0.14", features = ["full"] }
serde_yaml = "0.9"
toml = "0.8"
sha2 = "0.10"
base64 = "0.21"
flate2 = "1.0"
num-bigint = "0.4"
num-rational = "0.4"
ordered-float = { version = "4.2", features = ["serde"] }
parking_lot = "0.12"
crossbeam = "0.8"
rayon = "1.8"
indexmap = { version = "2.1", features = ["serde"] }
smallvec = "1.13"
bitflags = "2.4"
strum = { version = "0.25", features = ["derive"] }
lalrpop-util = "0.20"
ariadne = "0.4"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"
tempfile = "3.8"

[[bench]]
name = "benchmarks"
harness = false
